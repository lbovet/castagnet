name: Deploy castagnet to kitch

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: castagnet-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile castagnet.py wakeonlan/__init__.py

      - name: Import check
        run: python -c "import castagnet; print('import OK')"

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          KITCH_SSH_KEY: ${{ secrets.KITCH_SSH_KEY }}
          CLOUDBOX_SSH_KEY: ${{ secrets.CLOUDBOX_SSH_KEY }}
        run: |
          set -eu
          : "${KITCH_SSH_KEY:?KITCH_SSH_KEY secret is not set}"
          : "${CLOUDBOX_SSH_KEY:?CLOUDBOX_SSH_KEY secret is not set}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KITCH_SSH_KEY" > ~/.ssh/kitch
          printf '%s\n' "$CLOUDBOX_SSH_KEY" > ~/.ssh/cloudbox
          chmod 600 ~/.ssh/kitch ~/.ssh/cloudbox
          ssh-keyscan -H cloudbox.chee.li >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host cloudbox
            HostName cloudbox.chee.li
            User system
            IdentityFile ~/.ssh/cloudbox
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new

          Host kitch
            HostName 172.18.0.1
            Port 17202
            User shaman
            IdentityFile ~/.ssh/kitch
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ProxyCommand ssh -W %h:%p cloudbox
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy to kitch
        run: |
          set -eu
          ssh kitch 'test -d /srv/castagnet && systemctl cat castagnet.service >/dev/null 2>&1' || {
            echo "kitch is not prepared: merge lbovet/kitch#3 first" >&2
            exit 1
          }
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude 'ffp' \
            --exclude 'playlistparser' \
            -e ssh ./ kitch:/srv/castagnet/
          ssh kitch 'bash -s' <<'EOF'
          set -eu
          cd /srv/castagnet
          if ! systemctl cat castagnet.service >/dev/null 2>&1; then
            echo "castagnet.service is not installed on kitch; merge lbovet/kitch#3 first" >&2
            exit 1
          fi
          python3 -m venv .venv
          .venv/bin/pip install --no-cache-dir --upgrade pip
          .venv/bin/pip install --no-cache-dir -r requirements.txt
          sudo -n systemctl restart castagnet
          for i in $(seq 1 20); do
            systemctl is-active --quiet castagnet && break
            sleep 1
          done
          systemctl is-active castagnet
          curl -fsS --max-time 30 http://127.0.0.1:8088/castagnet/media/status >/dev/null
          EOF